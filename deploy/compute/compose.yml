name: kwonrec-production

x-runtime: &runtime
  image: ${DEPLOY_IMAGE:?Image digest required}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  env_file:
    - path: ./app.env
      format: raw
  environment:
    KWONREC_ALLOW_UNAUTHENTICATED: 'false'
  networks: [default]
  logging:
    driver: gcplogs
    options:
      mode: non-blocking
      max-buffer-size: 4m
      cache-disabled: 'false'
      cache-max-size: 10m
      cache-max-file: '3'
  depends_on:
    redis:
      condition: service_healthy

services:
  api:
    <<: *runtime
    ports: ['${KWONREC_BIND_IP:-127.0.0.1}:8001:8001']
    networks:
      default:
      server:
        aliases: [kwonrec]
    mem_limit: 768m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  worker:
    <<: *runtime
    command: [python, -m, src.runtime.worker]
    mem_limit: 768m
  setup:
    <<: *runtime
    restart: 'no'
    profiles: [setup]
    command: [python, -m, src.runtime.setup]
    mem_limit: 768m
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory, 512mb, --maxmemory-policy, noeviction]
    mem_limit: 1536m
    volumes: [redis_data:/data]
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  server:
    external: true
    name: kwonserver-production
volumes:
  redis_data:
    name: kwonrec-production_redis_data
