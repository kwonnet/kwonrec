services:
  kwonrec:
    build: .
    ports:
      - "127.0.0.1:8001:8001"
    environment: &environment
      KWONREC_REDIS_URL: redis://redis:6379/0
      KWONREC_API_KEY: ${KWONREC_API_KEY:?Set a random service key of at least 32 characters}
      KWONREC_DATABASE_URL: ${KWONREC_DATABASE_URL:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
  setup:
    build: .
    command: [python, -m, src.runtime.setup]
    environment: *environment
    profiles: [setup]
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
  worker:
    build: .
    command: ["python", "-m", "src.runtime.worker"]
    environment: *environment
    profiles: [connected]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  redis_data:
